name: Production Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install Newman CLI
        run: npm install -g newman

      - name: 4. Tạo kịch bản kiểm tra GET /users (< 800ms) và Chạy Newman
        run: |
          cat << 'EOF' > monitor_collection.json
          {
            "info": {
              "name": "Production_Monitor_GoRest",
              "schema": "https://schema.getpostman.com/json/collection/v2.1.0/collection.json"
            },
            "item": [
              {
                "name": "GET /users Availability & Performance",
                "event": [
                  {
                    "listen": "test",
                    "script": {
                      "type": "text/javascript",
                      "exec": [
                        "pm.test('Status code là 200 OK', function () {",
                        "    pm.response.to.have.status(200);",
                        "});",
                        "pm.test('Thời gian phản hồi dưới 800ms', function () {",
                        "    pm.expect(pm.response.responseTime).to.be.below(800);",
                        "});"
                      ]
                    }
                  }
                ],
                "request": {
                  "method": "GET",
                  "header": [],
                  "url": {
                    "raw": "https://gorest.co.in/public/v2/users",
                    "protocol": "https",
                    "host": ["gorest", "co", "in"],
                    "path": ["public", "v2", "users"]
                  }
                }
              }
            ]
          }
          EOF
          newman run monitor_collection.json --reporters cli
